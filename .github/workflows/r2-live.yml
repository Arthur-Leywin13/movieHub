# Test RÉEL contre Cloudflare R2 (aucune simulation). À lancer à la main : onglet Actions > « R2 réel » > Run workflow.
# Nécessite 4 secrets GitHub (voir docs/r2-live-test.md). Utiliser un bucket de test dédié.
# NON EXÉCUTÉ dans l'environnement de création : son premier lancement est le premier test réel.
name: R2 réel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/src/storage/**'
      - 'apps/api/src/admin/**'
      - 'apps/api/src/testing/r2-suite.ts'
      - '.github/workflows/r2-live.yml'

permissions:
  contents: read

jobs:
  r2-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier les secrets R2
        run: |
          missing=""
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets GitHub manquants :$missing (voir docs/r2-live-test.md)"
            exit 1
          fi

      - name: Installer les dépendances
        run: npm install

      - name: Test réel R2
        run: R2_LIVE_TEST=1 node --test --test-reporter=spec apps/api/src/storage/r2-live.test.ts
